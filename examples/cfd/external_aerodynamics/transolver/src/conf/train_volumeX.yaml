output_dir: "runs"
checkpoint_dir: null  # Optional: set custom checkpoint path, defaults to output_dir
run_id: "volumeX/bfloat16"

# Training configuration
training:
  precision: bfloat16 # float32, float16, bfloat16, or float8
  num_epochs: 251 # Add one to save at 250
  save_interval: 5  # Save checkpoint every N epochs
  compile: true

# Model configuration
model:
  _target_: physicsnemo.models.transolver.TransolverX
  functional_dim: 6 # Input feature dimension
  global_dim: 2
  geometry_dim: 3
  out_dim: 5        # Output feature dimension
  n_layers: 8       # Number of transformer layers
  n_hidden: 256     # Hidden dimension
  dropout: 0.0      # Dropout rate
  n_head: 8         # Number of attention heads
  act: "gelu"       # Activation function
  mlp_ratio: 1      # MLP ratio in attention blocks
  slice_num: 256     # Number of slices in physics attention
  use_te: false     # Use transformer engine
  plus: false

scheduler:
  name: "OneCycleLR"
  params:
    final_div_factor: 1e4

# # StepLR scheduler: Decays the learning rate by gamma every step_size epochs
# scheduler:
#   name: "StepLR"
#   params:
#     step_size: 50     # Decay every 100 epochs (set X as desired)
#     gamma: 0.5        # Decay factor


# Optimizer configuration
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8

# Data configuration
data:
  train:
    data_path: /group_data/drivaer_aws/domino/train/
  val:
    data_path: /group_data/drivaer_aws/domino/val/
  max_workers: 8
  normalization_dir: "src/"  # Directory for normalization files
  preload_depth: 1
  volume_sample_from_disk: true # Enable faster IO on pre-shuffled volumetric data
  pin_memory: true
  resolution: 250_000
  # Preprocessing switches:
  # (Changing thes will change the embedding dim)
  include_normals: true
  include_sdf: false
  include_geometry: true
  geometry_sampling: 300_000
  broadcast_global_features: false
  mode: volume
  data_keys:
    - "volume_fields"
    - "volume_mesh_centers"
    - "air_density"
    - "stream_velocity"
    - "stl_faces"
    - "stl_centers"
    - "stl_coordinates"

# Logging configuration
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
