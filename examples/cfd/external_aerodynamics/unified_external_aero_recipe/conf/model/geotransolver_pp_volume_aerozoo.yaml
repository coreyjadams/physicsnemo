# ---------------------------------------------------------------------------
# GeoTransolver++ (experimental) -- AeroZoo interior task.
# ---------------------------------------------------------------------------
# Pair with `dataset=aerozoo_volume`. The dataset puts every position and
# vector in the canonical frame of the body, in units of the body's RMS
# radius, so the model reads plain coordinates and components. Each boundary
# condition is its own set of tokens with its own input layer.
# The cell volume is withheld from model inputs by the AeroZoo rules, so
# `point_measure` is not passed: interior points count alike in the model.
# (The loss and the metrics are still volume-weighted.)

# rms: volume-weighted RMS error in the dataset's units (inlet speed,
# dynamic pressure), the form of the AeroZoo benchmark's metrics.
metrics: [l2, rms]

input_type: tensors
output_type: tensors
sampling_resolution: 50000     # interior points per case

# The neighbor search is data-dependent Python; not compiled yet.
compile: false

forward_kwargs:
  points: interior.points
  point_features:              # wall distance (1) and its direction (3)
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  global_features: global_data.conditions   # log10 Re, mean inlet velocity
  boundaries:
    inlet:
      points: boundaries.inlet_tokens.points
      normals: boundaries.inlet_tokens.point_data.normals
      measure: boundaries.inlet_tokens.point_data._effective_measure
      features: boundaries.inlet_tokens.point_data.velocity
    outlet:
      points: boundaries.outlet_tokens.points
      normals: boundaries.outlet_tokens.point_data.normals
      measure: boundaries.outlet_tokens.point_data._effective_measure
    no_slip:
      points: boundaries.no_slip_tokens.points
      normals: boundaries.no_slip_tokens.point_data.normals
      measure: boundaries.no_slip_tokens.point_data._effective_measure
      features: boundaries.no_slip_tokens.point_data.velocity
    slip:
      points: boundaries.slip_tokens.points
      normals: boundaries.slip_tokens.point_data.normals
      measure: boundaries.slip_tokens.point_data._effective_measure
    body_no_slip:
      points: boundaries.body_no_slip_tokens.points
      normals: boundaries.body_no_slip_tokens.point_data.normals
      measure: boundaries.body_no_slip_tokens.point_data._effective_measure
      features: boundaries.body_no_slip_tokens.point_data.velocity
    body_slip:
      points: boundaries.body_slip_tokens.points
      normals: boundaries.body_slip_tokens.point_data.normals
      measure: boundaries.body_slip_tokens.point_data._effective_measure

model:
  _target_: physicsnemo.experimental.models.geotransolver_pp.GeoTransolverPP
  out_dim: ${out_dim}          # auto-set from the dataset's `targets:` block
  boundary_features:           # feature channels per condition (prescribed velocity)
    inlet: 3
    outlet: 0
    no_slip: 3
    slip: 0
    body_no_slip: 3
    body_slip: 0
  point_features: 4
  global_features: 5
  n_hidden: 256
  n_layers: 12
  n_encoder_layers: 2
  n_head: 8
  n_latents: 64
  mlp_ratio: 4
  radius: 0.5                  # in body RMS radii
  n_neighbors: 32
  routing_temperature: 10.0    # bounded cosine scores; null for plain dot product
