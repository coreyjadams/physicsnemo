# ---------------------------------------------------------------------------
# GeoTransolver -- AeroZoo interior task, boundary conditions as globals.
# ---------------------------------------------------------------------------
# Pair with `dataset=aerozoo_volume`. The standard GeoTransolver volume
# setup: the geometry is the positions of the boundary tokens (its ball
# query needs positions only), and the boundary conditions enter as one
# global token (log10 Re and the mean inlet velocity). To give it the
# per-cell conditions, use geotransolver_bc_volume_aerozoo.yaml.
# Add `dataset_overrides.canonical_axes=false` to train without the
# canonical rotation (origin and length still come from the body).

input_type: tensors
output_type: tensors

forward_kwargs:
  geometry: boundaries.tokens.points
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  local_positions: interior.points
  global_embedding: global_data.conditions

model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}
  functional_dim: 7       # coords (3) + wall distance (1) + its direction (3)
  geometry_dim: 3
  global_dim: 4           # log10 Re, mean inlet velocity (3)
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: true
  radii: [0.01, 0.05, 0.25, 1.0, 2.5, 5.0]   # in body RMS radii
  neighbors_in_radius: [8, 16, 32, 32, 64, 128]
  n_hidden_local: 32
  state_mixing_mode: "weighted"
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
