# ---------------------------------------------------------------------------
# GeoTransolver -- AeroZoo interior task, per-cell boundary conditions.
# ---------------------------------------------------------------------------
# Pair with `dataset=aerozoo_volume`. As geotransolver_volume_aerozoo.yaml,
# but the geometry tokens carry the boundary conditions: position (3),
# normal (3), prescribed velocity (3) and a one-hot code of the condition
# (6). The multi-scale ball query reads the geometry as positions only, so
# the local features are off here.

# rms: volume-weighted RMS error in the dataset's units (inlet speed,
# dynamic pressure), the form of the AeroZoo benchmark's metrics.
metrics: [l2, rms]

input_type: tensors
output_type: tensors

forward_kwargs:
  geometry:
    - boundaries.tokens.points
    - boundaries.tokens.point_data.features
  local_embedding:
    - interior.points
    - interior.point_data.sdf
    - interior.point_data.sdf_normals
  local_positions: interior.points
  global_embedding: global_data.conditions

model:
  _target_: physicsnemo.models.geotransolver.GeoTransolver
  out_dim: ${out_dim}
  functional_dim: 7       # coords (3) + wall distance (1) + its direction (3)
  geometry_dim: 15        # position, normal, velocity, one-hot condition
  global_dim: 5           # log10 Re, mean inlet velocity (3), outlet speed ratio
  n_layers: 12
  n_hidden: 256
  dropout: 0.0
  n_head: 8
  act: "gelu"
  mlp_ratio: 4
  slice_num: 256
  use_te: false
  plus: false
  include_local_features: false
  state_mixing_mode: "weighted"
  activation_checkpointing: false
  checkpointing_ratio: 1.0
  activation_checkpointing_components: [blocks]
