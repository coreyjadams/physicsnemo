# Datapipe Demo Configuration
# This demonstrates the same functionality as datapipe_python_configuration.py
# but configured entirely via Hydra YAML.

defaults:
  - reader: tensorstore_zarr
  - transforms: normalize
  - _self_

# Reader configuration overrides
reader:
  path: ./variable_size_data/zarr/
  group_pattern: "*.zarr"
  # Coordinated subsampling: reads contiguous chunks from large tensors
  coordinated_subsampling:
    n_points: 10000
    target_keys:
      - features
      - coords

# Dataset configuration
dataset:
  _target_: physicsnemo.datapipes.core.Dataset
  reader: ${reader}
  transforms: ${transforms}

# DataLoader configuration
dataloader:
  _target_: physicsnemo.datapipes.core.DataLoader
  dataset: ${dataset}
  batch_size: 5
