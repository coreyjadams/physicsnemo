# This CI runs on pull requests and uses testmon to skip tests
# that don't have changed dependencies based on the nightly cache.
# The tests run here will only use UV.
#
# Currently this uses ubuntu cpu tests, it's going to switch to github nvidia runners.

name: Pull Request Github CI
on:
  pull_request:
    branches:
      - main
      - "release/*"
  push:
    branches:
      - "pull-request/[0-9]+"
  workflow_dispatch:
    # Allow manual triggering for debugging the CI.


jobs:
  # Stage 1: Build and cache the environment
  build-environment:
    name: Build Environment (Python ${{ matrix.python-version }}, OS ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Restore uv cache
      id: cache-uv-restore
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: uv-env-py${{ matrix.python-version }}-latest

    - name: Install package with uv
      if: steps.cache-uv-restore.outputs.cache-hit != 'true'
      run: |
        # Install core dependencies and development group
        UV_PREVIEW=1 uv sync --group dev --preview-features extra-build-dependencies

    - name: Free disk space before caching
      if: steps.cache-uv-restore.outputs.cache-hit != 'true'
      run: |
        rm -rf ~/.cache/uv
        df -h

    - name: Delete old environment cache
      if: steps.cache-uv-restore.outputs.cache-hit != 'true'
      run: |
        gh cache delete "uv-env-py${{ matrix.python-version }}-latest" || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Save environment to cache
      if: steps.cache-uv-restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: .venv
        key: uv-env-py${{ matrix.python-version }}-latest

  # Stage 2: Run testmon tests
  testmon:
    name: Testmon (Python ${{ matrix.python-version }}, OS ${{ matrix.os }})
    needs: build-environment
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Restore environment from cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: uv-env-py${{ matrix.python-version }}-latest
        fail-on-cache-miss: true

    - name: Restore testmon database from cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .testmondata
          .testmondata-shm
          .testmondata-wal
        key: testmon-${{ matrix.os }}-py${{ matrix.python-version }}-latest
        restore-keys: |
          testmon-${{ matrix.os }}-py${{ matrix.python-version }}-

    - name: Run core tests (with testmon)
      run: |
        uv run python -m pytest --testmon --ignore-glob="*docs*" --ignore-glob="*examples*"

  # Stage 3: Run coverage tests and upload artifacts
  coverage:
    name: Coverage (Python ${{ matrix.python-version }}, OS ${{ matrix.os }})
    needs: build-environment
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 5
        max_attempts: 3
        command: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

    - name: Restore environment from cache
      uses: actions/cache/restore@v4
      with:
        path: .venv
        key: uv-env-py${{ matrix.python-version }}-latest
        fail-on-cache-miss: true

    - name: Restore testmon database from cache
      uses: actions/cache/restore@v4
      with:
        path: |
          .testmondata
          .testmondata-shm
          .testmondata-wal
        key: testmon-${{ matrix.os }}-py${{ matrix.python-version }}-latest
        restore-keys: |
          testmon-${{ matrix.os }}-py${{ matrix.python-version }}-

    - name: Download nightly coverage baseline
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: github-nightly.yml
        name: coverage-data-${{ matrix.os }}-py${{ matrix.python-version }}
        path: .coverage-baseline
        if_no_artifact_found: warn
      continue-on-error: true

    - name: Run core tests for coverage report (testmon-selected)
      run: |
        # Use testmon to only run tests affected by changes, with coverage
        uv run coverage run --rcfile='test/coverage.pytest.rc' -m pytest --testmon --ignore-glob="*docs*" --ignore-glob="*examples*"

    - name: Run doc tests (testmon not supported for doctests)
      run: |
        uv run coverage run --rcfile='test/coverage.docstring.rc' -m pytest --doctest-modules physicsnemo/ --ignore-glob="*internal*" --ignore-glob="*experimental*"

    - name: Merge coverage reports
      run: |
        # Combine PR coverage files first
        uv run coverage combine

        # If nightly baseline exists, combine it with PR coverage for complete report
        if [ -f .coverage-baseline/.coverage ]; then
          echo "Combining with nightly coverage baseline..."
          # Rename PR combined coverage
          mv .coverage .coverage.pr
          # Combine baseline and PR coverage
          uv run coverage combine .coverage-baseline/.coverage .coverage.pr
        fi

        uv run coverage report --show-missing --omit="*test*" --omit="*internal*" --omit="*experimental*" --fail-under=45
        uv run coverage html
        uv run coverage xml -o coverage.xml

    - name: Upload coverage HTML report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report-${{ matrix.os }}-py${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 7
